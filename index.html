<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>報價系統</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style type="text/tailwindcss">
  @layer components {
    /* 輸入框字級 16px 以上，iPhone 才不會在點選時自動放大畫面 */
    .inp { @apply border border-gray-300 rounded-lg px-3 py-2 w-full bg-white text-base; }
    .btn { @apply inline-flex items-center justify-center px-4 py-2 rounded-lg border border-gray-300 bg-white text-sm min-h-[40px] disabled:opacity-50; }
    .btn-primary { @apply bg-blue-600 border-blue-600 text-white; }
    /* 手機：全螢幕；電腦：置中彈窗 */
    .modal-wrap { @apply fixed inset-0 bg-black/40 z-20 md:flex md:items-center md:justify-center md:p-4; }
    .modal-box { @apply bg-white w-full h-full overflow-y-auto p-4 md:h-auto md:max-h-[90vh] md:max-w-2xl md:rounded-xl md:p-6 md:shadow-xl; }
    .card { @apply bg-white rounded-xl shadow-sm border p-3; }
  }
  [v-cloak] { display: none; }
  /* 報價編輯頁的固定列：手機停在底部分頁列上方，電腦貼齊底部 */
  .sticky-bar { position: fixed; left: 0; right: 0; z-index: 10; bottom: calc(3.7rem + env(safe-area-inset-bottom)); }
  @media (min-width: 768px) { .sticky-bar { bottom: 0; } }
</style>
</head>
<body class="bg-gray-50 text-gray-800">
<div id="app" v-cloak></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
